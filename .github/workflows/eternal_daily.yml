name: NeuralTech Daily Publisher (AR + EN)

on:
  schedule:
    - cron: '23 6 * * *'    # 06:23 UTC يومياً
    - cron: '47 15 * * *'   # محاولة احتياطية؛ تتخطى تلقائياً إن نُشر مقال اليوم
  workflow_dispatch:
    inputs:
      force:
        description: 'انشر مقالاً جديداً حتى لو نُشر مقال اليوم'
        type: boolean
        default: false
      refresh_images:
        description: 'ولّد صوراً مناسبة لكل المقالات القديمة (بدون نشر مقال جديد)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Write today's article (AR + EN) / refresh images
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI3 }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          NT_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '' }}
          NT_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_images && '1' || '' }}
        run: python3 daily_publisher.py

      - name: Commit & push
        run: |
          git config user.name "NeuralTech Publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then echo "لا تغييرات للنشر"; exit 0; fi
          git commit -m "📰 NeuralTech update $(date -u +%F)"
          git pull --rebase origin main
          git push origin main
